; IT8888F Configuration File - Gravis UltraSound Audio Card
; This configuration sets up the IT8888F bridge for a typical GUS installation
[INFO]
NAME=GUS
DESCRIPTION=Gravis UltraSound Audio Card

[IO_SPACES]
; I/O Space format: 0x80000000 | (speed<<29) | (size<<24) | base_address
; Speed: 0=Sub, 1=Slow, 2=Med, 3=Fast | Size: 0=1B, 1=2B, 2=4B, 3=8B, 4=16B, 5=32B, 6=64B, 7=128B

IO0=0xE4000220
; 0x220-0x22F: Main GUS I/O port (16 bytes, fast access)
; Used for: Sample upload/download, mixer control, IRQ/DMA setup

IO1=0xE3000330  
; 0x330-0x337: GUS MIDI port (8 bytes, fast access)
; Used for: MIDI input/output, MPU-401 compatibility

IO2=0xE2000388
; 0x388-0x38B: AdLib/OPL2 compatibility port (4 bytes, fast access) 
; Used for: FM synthesis compatibility with older games

IO3=0x00000000
; Disabled - GUS doesn't need additional I/O spaces

IO4=0x00000000
; Disabled

IO5=0x00000000
; Disabled

[MEMORY_SPACES]
; Memory spaces not used by GUS - all audio data transfers via I/O ports
MEM0=0x00000000
MEM1=0x00000000
MEM2=0x00000000
MEM3=0x00000000

[DMA]
; DMA format: 0x80000000 | dma_channel_number
DMA0=0x80000001
; DMA channel 1: 8-bit audio playback (most common setting)

DMA1=0x00000000
; DMA channels 2-3: Not used

DMA2=0x80000005
; DMA channel 5: 16-bit audio recording/playback

DMA3=0x00000000
; DMA channels 6-7: Not used

[CONTROL]
MISC_CONTROL=0x8C000003
; Bit 31: DDMA Concurrent Mode enabled (improves audio performance)
; Bit 27: PCI Clock enabled (required for proper timing)
; Bit 26: ISA Refresh enabled (maintains system stability)
; Bit 1: Delayed Transaction enabled (reduces PCI bus conflicts)
; Bit 0: Subtractive decode enabled (catches unmapped I/O accesses)

ISA_CONTROL=0x00000000
; Not used for GUS configuration