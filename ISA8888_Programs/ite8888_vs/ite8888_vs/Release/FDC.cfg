; IT8888F Configuration File - Standard PC Floppy Drive Controller
[INFO]
NAME=FDC
DESCRIPTION=Floppy Drive Controller

[IO_SPACES]
IO0=0xE20003F0
; 0x3F0-0x3F7: Standard floppy controller I/O range (8 bytes, fast access)
; 0x3F0: Status Register A, 0x3F1: Status Register B
; 0x3F2: Digital Output Register, 0x3F3: Tape Drive Register
; 0x3F4: Main Status Register, 0x3F5: Data FIFO
; 0x3F6: Reserved, 0x3F7: Digital Input Register

IO1=0x00000000
IO2=0x00000000
IO3=0x00000000
IO4=0x00000000
IO5=0x00000000
; Only one I/O range needed for FDC

[MEMORY_SPACES]
MEM0=0x00000000
MEM1=0x00000000
MEM2=0x00000000
MEM3=0x00000000
; FDC uses only I/O ports, no memory mapping

[DMA]
DMA0=0x00000000
; DMA 0-1: Not used

DMA1=0x80000002
; DMA channel 2: Standard floppy disk data transfers
; This is the traditional DMA channel for all floppy operations

DMA2=0x00000000
DMA3=0x00000000
; Other DMA channels not used

[CONTROL]
MISC_CONTROL=0x8C000003
; Standard control settings for legacy ISA device compatibility

ISA_CONTROL=0x00000000