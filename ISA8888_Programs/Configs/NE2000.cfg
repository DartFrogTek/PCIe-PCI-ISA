; IT8888F Configuration File - NE2000 Compatible Ethernet Adapter
[INFO]
NAME=NE2000
DESCRIPTION=NE2000 Compatible Ethernet Adapter

[IO_SPACES]
IO0=0xE5000300
; 0x300-0x31F: NE2000 register range (32 bytes, fast access)
; 0x300-0x30F: Page 0 registers (Command, PSTART, PSTOP, etc.)
; 0x310-0x31F: Data port and reset register
; This is the most common I/O base for NE2000 cards

IO1=0x00000000
IO2=0x00000000
IO3=0x00000000
IO4=0x00000000
IO5=0x00000000

[MEMORY_SPACES]
MEM0=0x00000000
MEM1=0x00000000
MEM2=0x00000000
MEM3=0x00000000
; NE2000 uses programmed I/O, not memory mapping

[DMA]
DMA0=0x00000000
DMA1=0x00000000
DMA2=0x00000000
DMA3=0x00000000
; NE2000 doesn't use DMA - all data transfers via I/O ports

[CONTROL]
MISC_CONTROL=0x8C000003
; MISC_CONTROL=0x8C000002 (Positive Decode)
; Standard settings for ISA network card

ISA_CONTROL=0x00000000