; IT8888F Configuration File - Sound Blaster Compatible Audio
[INFO]
NAME=SB
DESCRIPTION=Sound Blaster Compatible

[IO_SPACES]
IO0=0xE4000220
; 0x220-0x22F: Sound Blaster DSP I/O range (16 bytes, fast access)
; 0x22C: DSP Write, 0x22E: DSP Read, 0x22F: DSP Ready status
; Also includes mixer registers and game port interface

IO1=0xE2000388
; 0x388-0x38B: AdLib/OPL2 FM synthesis (4 bytes, fast access)
; Required for music in most DOS games, provides 9-channel FM audio

IO2=0x00000000
IO3=0x00000000
IO4=0x00000000
IO5=0x00000000

[MEMORY_SPACES]
MEM0=0x00000000
MEM1=0x00000000
MEM2=0x00000000
MEM3=0x00000000
; Sound Blaster uses I/O ports only

[DMA]
DMA0=0x80000001
; DMA channel 1: 8-bit digital audio (Sound Blaster 1.x/2.x compatibility)

DMA1=0x80000005
; DMA channel 5: 16-bit digital audio (Sound Blaster 16 compatibility)
; Allows full-duplex operation when combined with 8-bit channel

DMA2=0x00000000
DMA3=0x00000000

[CONTROL]
MISC_CONTROL=0x8C000003
; MISC_CONTROL=0x8C000002 (Positive Decode)
; Optimized for audio streaming performance

ISA_CONTROL=0x00000000