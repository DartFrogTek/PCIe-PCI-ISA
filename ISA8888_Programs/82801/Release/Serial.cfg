; IT8888F Configuration File - Multi-Port Serial Controller
[INFO]
NAME=SERIAL
DESCRIPTION=Multi-Port Serial Controller

[IO_SPACES]
IO0=0xE20003F8
; 0x3F8-0x3FF: COM1 (8 bytes, fast access)
; Standard UART registers: THR, RHR, IER, IIR, FCR, LCR, MCR, LSR, MSR

IO1=0xE20002F8
; 0x2F8-0x2FF: COM2 (8 bytes, fast access)

IO2=0xE20003E8
; 0x3E8-0x3EF: COM3 (8 bytes, fast access)

IO3=0xE20002E8
; 0x2E8-0x2EF: COM4 (8 bytes, fast access)

IO4=0x00000000
IO5=0x00000000

[MEMORY_SPACES]
MEM0=0x00000000
MEM1=0x00000000
MEM2=0x00000000
MEM3=0x00000000
; Serial ports use I/O space only

[DMA]
DMA0=0x00000000
DMA1=0x00000000
DMA2=0x00000000
DMA3=0x00000000
; Standard serial ports don't use DMA (interrupt-driven or polled I/O)

[CONTROL]
MISC_CONTROL=0x8C000001
; MISC_CONTROL=0x8C000002 (Positive Decode)
; Bit 31: DDMA Concurrent enabled
; Bit 27: PCI Clock enabled  
; Bit 26: ISA Refresh enabled
; Bit 0: Subtractive decode enabled (important for serial port compatibility)
; No delayed transaction bit - serial ports need immediate response

; 0x8C000003 = Subtractive decode ON + Delayed Transaction ON
; 0x8C000002 = Subtractive decode OFF + Delayed Transaction ON
; 0x8C000001 = Subtractive decode ON + Delayed Transaction OFF
; 0x8C000000 = Subtractive decode OFF + Delayed Transaction OFF

ISA_CONTROL=0x00000000